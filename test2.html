<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>データ取得 接続テスト2</title>
<style>
:root{--bg:#F1F4F8;--surface:#fff;--line:#D7DDE6;--ink:#111720;--muted:#5D6877;--ok:#0F8A45;--ng:#CE2B25;--accent:#12666F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0E13;--surface:#151C24;--line:#2A333F;--ink:#E8EDF4;--muted:#8A97A8;--ok:#35CE74;--ng:#FF6159;--accent:#2FA3AD;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 50px}
h1{font-size:18px;margin:0 0 4px}
p.lead{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.top{display:flex;align-items:center;gap:9px}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap;flex:none}
.badge.ok{background:rgba(15,138,69,.14);color:var(--ok)}
.badge.ng{background:rgba(206,43,37,.13);color:var(--ng)}
.badge.wait{background:rgba(120,130,145,.16);color:var(--muted)}
.nm{font-weight:700;font-size:13px;flex:1 1 auto;min-width:0}
.ms{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.det{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);margin-top:5px;word-break:break-all;white-space:pre-wrap;max-height:78px;overflow:auto}
textarea{width:100%;height:150px;font-family:ui-monospace,monospace;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>データ取得 接続テスト2</h1>
  <p class="lead">本命候補だけに絞った第2回テストです。[proxy]=中継経由 / [API]=株価API直接 / [FX]=為替。緑が使える経路です。終わったら「結果をコピー」で貼って送ってください。（demo・testキーは無効キーです。401や「invalid key」が返ってきた場合でも“通信は通っている”ので、それは有効な手がかりになります）</p>
  <div class="bar">
    <button id="run">もう一度テスト</button>
    <button class="sec" id="copy">結果をコピー</button>
  </div>
  <div class="sum" id="sum">テスト中…</div>
  <div id="list"></div>
  <textarea id="out" readonly placeholder="結果テキスト"></textarea>
</div>
<script>
(function(){
  "use strict";
  var Y = "https://query1.finance.yahoo.com/v8/finance/chart/7203.T?range=1d&interval=5m";
  var SQ_JP = "https://stooq.com/q/l/?s=7203.jp&f=sd2t2ohlcv&h&e=csv";

  var TESTS = [
    { n:"[proxy] r.jina.ai 経由 Yahoo", u:"https://r.jina.ai/" + Y },
    { n:"[proxy] r.jina.ai 経由 Stooq", u:"https://r.jina.ai/" + SQ_JP },
    { n:"[proxy] cors.lol 経由 Yahoo", u:"https://api.cors.lol/?url=" + encodeURIComponent(Y) },
    { n:"[proxy] cors.workers.dev 経由 Yahoo", u:"https://test.cors.workers.dev/?" + Y },
    { n:"[proxy] allorigins /get 経由 Yahoo", u:"https://api.allorigins.win/get?url=" + encodeURIComponent(Y) },
    { n:"[proxy] whateverorigin 経由 Yahoo", u:"https://whateverorigin.org/get?url=" + encodeURIComponent(Y) },
    { n:"[proxy] corsfix 経由 Yahoo", u:"https://proxy.corsfix.com/?" + Y },
    { n:"[API] TwelveData 米国株(demo)", u:"https://api.twelvedata.com/time_series?symbol=AAPL&interval=1day&outputsize=10&apikey=demo" },
    { n:"[API] TwelveData 日本株(demo)", u:"https://api.twelvedata.com/time_series?symbol=7203:TSE&interval=1day&outputsize=10&apikey=demo" },
    { n:"[API] Finnhub 米国株(キーなし)", u:"https://finnhub.io/api/v1/quote?symbol=AAPL&token=test" },
    { n:"[API] FMP 米国株(demo)", u:"https://financialmodelingprep.com/api/v3/quote/AAPL?apikey=demo" },
    { n:"[API] FMP 日本株(demo)", u:"https://financialmodelingprep.com/api/v3/quote/7203.T?apikey=demo" },
    { n:"[FX] open.er-api.com（キー不要）", u:"https://open.er-api.com/v6/latest/USD" },
    { n:"[FX] frankfurter.dev（キー不要）", u:"https://api.frankfurter.dev/v1/latest?base=USD&symbols=JPY" },
    { n:"[暗号資産] Binance 再確認", u:"https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=5" },
    { n:"[暗号資産] CoinGecko 再確認", u:"https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=jpy" }
  ];

  var list = document.getElementById("list");
  var sum = document.getElementById("sum");
  var out = document.getElementById("out");
  var rows = [];

  function build(){
    list.textContent = "";
    rows = TESTS.map(function(t){
      var el = document.createElement("div");
      el.className = "row";
      el.innerHTML = '<div class="top"><span class="badge wait">待機</span><span class="nm"></span><span class="ms"></span></div><div class="det"></div>';
      el.querySelector(".nm").textContent = t.n;
      list.appendChild(el);
      return el;
    });
  }

  function run(){
    build();
    var results = [];
    var done = 0;
    sum.textContent = "テスト中… (0/" + TESTS.length + ")";
    TESTS.forEach(function(t, i){
      setTimeout(function(){
        var el = rows[i], badge = el.querySelector(".badge"), ms = el.querySelector(".ms"), det = el.querySelector(".det");
        badge.className = "badge wait"; badge.textContent = "実行中";
        var t0 = Date.now();
        var ac = new AbortController();
        var timer = setTimeout(function(){ ac.abort(); }, 10000);
        fetch(t.u, { signal: ac.signal, cache:"no-store", referrerPolicy:"no-referrer" })
          .then(function(r){
            return r.text().then(function(txt){ return { status:r.status, ok:r.ok, txt:txt }; });
          })
          .then(function(r){
            clearTimeout(timer);
            var dt = Date.now() - t0;
            var sample = (r.txt || "").replace(/\s+/g," ").slice(0,150);
            if(r.ok && sample.length){
              badge.className = "badge ok"; badge.textContent = "OK " + r.status;
              results.push("OK   " + t.n + " (" + dt + "ms) :: " + sample.slice(0,90));
            } else {
              badge.className = "badge ng"; badge.textContent = "NG " + r.status;
              results.push("NG   " + t.n + " HTTP " + r.status + " :: " + sample.slice(0,90));
            }
            ms.textContent = dt + "ms";
            det.textContent = sample || "(空のレスポンス)";
          })
          .catch(function(e){
            clearTimeout(timer);
            var dt = Date.now() - t0;
            var msg = (e && e.name === "AbortError") ? "タイムアウト" : "ブロック/通信失敗 (" + ((e && e.message) || e) + ")";
            badge.className = "badge ng"; badge.textContent = "NG";
            ms.textContent = dt + "ms";
            det.textContent = msg;
            results.push("NG   " + t.n + " :: " + msg);
          })
          .then(function(){
            done++;
            sum.textContent = "テスト中… (" + done + "/" + TESTS.length + ")";
            if(done === TESTS.length){
              var okc = results.filter(function(r){ return r.indexOf("OK") === 0; }).length;
              sum.innerHTML = "<b>完了：" + okc + " / " + TESTS.length + " の経路が利用可能</b>";
              out.value = "UA: " + navigator.userAgent + "\n" + location.href + "\n\n" + results.join("\n");
            }
          });
      }, i * 180);
    });
  }

  document.getElementById("run").addEventListener("click", run);
  document.getElementById("copy").addEventListener("click", function(){
    out.select();
    if(navigator.clipboard) navigator.clipboard.writeText(out.value).then(function(){ alert("コピーしました"); }, function(){ alert("上の枠を長押しして手動でコピーしてください"); });
    else alert("上の枠を長押しして手動でコピーしてください");
  });
  run();
})();
</script>
</body>
</html>
